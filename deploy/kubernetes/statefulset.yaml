# A three-member memory-graph cluster (ADR 0004 D10; docs/deploy/kubernetes.md).
#
# Identity comes from the pod name, without a shell (the image is scratch):
#   --node-id-from-hostname      memory-graph-N is node N+1
#   --bootstrap-or-join <peer>   memory-graph-0 bootstraps, the others join
#                                it and become voters once caught up
#                                (--auto-promote)
# On a restart every pod finds its data directory initialized, so both are
# plain restarts. podManagementPolicy: Parallel, because after a full stop
# no single pod can be ready alone (a leader needs a quorum), so ordered
# start-up would wait for pod 0 forever.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: memory-graph
  labels:
    app.kubernetes.io/name: memory-graph
spec:
  serviceName: memory-graph
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: memory-graph
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memory-graph
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        fsGroup: 65532
      containers:
        - name: memory-graph
          image: ghcr.io/p47phoenix/memory-graph:main
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MEMORY_GRAPH_LOG
              value: info
          args:
            - serve
            - --data-dir
            - /data
            - --listen
            - 0.0.0.0:7000
            - --advertise
            - $(POD_NAME).memory-graph.$(POD_NAMESPACE).svc.cluster.local:7000
            - --node-id-from-hostname
            - --bootstrap-or-join
            - memory-graph-0.memory-graph.$(POD_NAMESPACE).svc.cluster.local:7000
            - --auto-promote
            - --metrics-listen
            - 0.0.0.0:9100
            - --log-format
            - json
          ports:
            - name: grpc
              containerPort: 7000
            - name: metrics
              containerPort: 9100
          # grpc.health.v1 probes (Kubernetes >= 1.27). Ready: a leader is
          # known and this pod applied to within --ready-max-lag entries of
          # the leader's commit index; live: the process serves.
          startupProbe:
            grpc:
              port: 7000
            periodSeconds: 2
            failureThreshold: 150
          readinessProbe:
            grpc:
              port: 7000
              service: memory-graph.ready
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            grpc:
              port: 7000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
