name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: python3 scripts/test_gate.py
      - name: Pure-Rust gate (no -sys / C build scripts)
        run: python3 scripts/check-no-c-deps.py
  windows:
    # The suites where the host OS shows through (#100, #120): path separators
    # in the walk and on the wire, language detection, open errors. Not the
    # whole workspace: the cluster suites spawn several servers and
    # are OS-neutral, and would roughly triple this leg's time. The store's
    # chunked-ingest timing test runs here too: it gates on a ratio against
    # an unchunked ingest on the same machine, not on absolute time (#154).
    runs-on: windows-latest
    steps:
      # The runner defaults to core.autocrlf=true. .gitattributes already
      # pins the corpus and fixtures as -text; this makes every other file
      # the tests read byte-identical to Linux too.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p graph-core
      - run: cargo test -p graph-store
      - run: cargo test -p graph-client --test conformance
      - run: cargo test -p graph-cli --test e2e
      - run: cargo test -p graph-cli --test corpus
      - run: cargo test -p graph-cli --test serve_e2e
  proto-regen:
    # The generated gRPC code under crates/graph-proto/src/gen is checked in
    # (ADR 0004 D1). Regenerate it with the pure-Rust compiler (protox, no
    # protoc installed) and fail on any drift from the .proto files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "xtask -> target" }
      - run: cargo run --manifest-path xtask/Cargo.toml --locked -- proto
      - run: git diff --exit-code -- crates/graph-proto/src/gen
  disk-full:
    # Real ENOSPC: index into a size-capped tmpfs, stop cleanly, resume.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p graph-cli
      - run: bash scripts/disk-full-tmpfs.sh target/release/memory-graph
  s3-e2e:
    # Backups against a real S3 server (epic story 38, ADR 0006 testing), over
    # plain HTTP with credentials enforced. The ADR named MinIO, but its
    # images are no longer pullable from Docker Hub (`pull access denied for
    # minio/minio` on the runner), so this runs SeaweedFS's S3 gateway, which
    # enables SigV4 auth from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
    # Started with `docker run` because `services:` cannot pass its command.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: mg-e2e-key
      AWS_SECRET_ACCESS_KEY: mg-e2e-secret-0123456789
      MG_S3_ENDPOINT: http://127.0.0.1:8333
      MG_S3_BUCKET: mg-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start SeaweedFS (S3 on 8333, auth on)
        run: |
          docker run -d --name s3 -p 8333:8333 \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY \
            chrislusf/seaweedfs:4.48 server -s3 -dir=/data
          created=
          for i in $(seq 90); do
            if docker exec s3 sh -c "echo 's3.bucket.create -name $MG_S3_BUCKET' | weed shell -master=localhost:9333" 2>&1 \
              | grep -q "created bucket"; then created=1; break; fi
            sleep 1
          done
          if [ -z "$created" ]; then
            echo "::error::SeaweedFS did not create bucket $MG_S3_BUCKET within 90 s"
            exit 1
          fi
      - name: Anonymous requests are refused
        run: |
          for i in $(seq 60); do
            # Until the gateway listens curl fails (7, 56); keep waiting.
            code=$(curl -s -o /dev/null -w '%{http_code}' "$MG_S3_ENDPOINT/$MG_S3_BUCKET?list-type=2" || true)
            [ "$code" != 000 ] && [ -n "$code" ] && break
            sleep 1
          done
          echo "anonymous ListObjectsV2: $code"
          test "$code" = 403
      - run: cargo test -p graph-cli --test s3_e2e -- --nocapture
      - name: S3 server log on failure
        if: failure()
        run: docker logs s3 2>&1 | tail -n 200
  probes:
    # The machine probes on each platform with one: memory must be known
    # (and say where it came from), disk must be known. macOS only runs here.
    strategy:
      matrix:
        # ubuntu pinned to the docker image's release so the runner-built
        # binary's glibc is not newer than the image's.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p graph-cli --lib -- sysinfo diskinfo report
      - run: cargo test -p graph-cli --test e2e sysinfo_reports_the_probes
      - run: cargo run --release -p graph-cli -- sysinfo
      - run: cargo run --release -p graph-cli -- sysinfo --json | python3 scripts/check-probes.py
        shell: bash
      - name: Container memory limit (cgroup) is honoured
        if: runner.os == 'Linux'
        run: |
          docker run --rm --memory=512m -v "$PWD/target/release/memory-graph:/mg:ro" ubuntu:24.04 /mg sysinfo
          docker run --rm --memory=512m -v "$PWD/target/release/memory-graph:/mg:ro" ubuntu:24.04 /mg sysinfo --json \
            | python3 scripts/check-probes.py --max-total $((512 * 1024 * 1024)) --source-contains cgroup --max-budget-share 0.6
      - name: A box without /proc/meminfo still reads memory (sysinfo(2))
        if: runner.os == 'Linux'
        run: |
          docker run --rm --mount type=bind,src=/dev/null,dst=/proc/meminfo -v "$PWD/target/release/memory-graph:/mg:ro" ubuntu:24.04 /mg sysinfo --json \
            | python3 scripts/check-probes.py --source-contains "sysinfo(2)"
