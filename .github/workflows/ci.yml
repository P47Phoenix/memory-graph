name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: python3 scripts/test_gate.py
      - name: Pure-Rust gate (no -sys / C build scripts)
        run: python3 scripts/check-no-c-deps.py
  disk-full:
    # Real ENOSPC: index into a size-capped tmpfs, stop cleanly, resume.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p graph-cli
      - run: bash scripts/disk-full-tmpfs.sh target/release/memory-graph
  probes:
    # The machine probes on each platform with one: memory must be known
    # (and say where it came from), disk must be known. macOS only runs here.
    strategy:
      matrix:
        # ubuntu pinned to the docker image's release so the runner-built
        # binary's glibc is not newer than the image's.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p graph-cli --lib -- sysinfo diskinfo report
      - run: cargo test -p graph-cli --test e2e sysinfo_reports_the_probes
      - run: cargo run --release -p graph-cli -- sysinfo
      - run: cargo run --release -p graph-cli -- sysinfo --json | python3 scripts/check-probes.py
        shell: bash
      - name: Container memory limit (cgroup) is honoured
        if: runner.os == 'Linux'
        run: |
          docker run --rm --memory=512m -v "$PWD/target/release/memory-graph:/mg:ro" ubuntu:24.04 /mg sysinfo
          docker run --rm --memory=512m -v "$PWD/target/release/memory-graph:/mg:ro" ubuntu:24.04 /mg sysinfo --json \
            | python3 scripts/check-probes.py --max-total $((512 * 1024 * 1024)) --source-contains cgroup
      - name: A box without /proc/meminfo still reads memory (sysinfo(2))
        if: runner.os == 'Linux'
        run: |
          docker run --rm --mount type=bind,src=/dev/null,dst=/proc/meminfo -v "$PWD/target/release/memory-graph:/mg:ro" ubuntu:24.04 /mg sysinfo --json \
            | python3 scripts/check-probes.py --source-contains "sysinfo(2)"
