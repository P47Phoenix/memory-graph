name: Docker
# Builds the memory-graph container image (Dockerfile: static musl binary on
# scratch, linux/amd64 + linux/arm64) and smoke-tests the amd64 image. Pushes
# to ghcr.io/<owner>/memory-graph on main (tags `main`, `sha-<short>`) and on
# v* tags (`<version>`, `<major>.<minor>`, `latest`); pull requests only
# build and test.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build the amd64 image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: memory-graph:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (sysinfo, index, search, describe, cgroup limit)
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm memory-graph:smoke sysinfo
          docker run --rm memory-graph:smoke sysinfo --json | python3 scripts/check-probes.py
          # A cgroup memory limit sizes the budget for the container, not the host.
          docker run --rm --memory=512m memory-graph:smoke sysinfo --json \
            | python3 scripts/check-probes.py --max-total $((512 * 1024 * 1024)) --source-contains cgroup
          # Index a small source tree from a read-only mount into a fresh named
          # volume on /data (the image's working directory and default --db).
          docker volume rm -f mg-smoke >/dev/null 2>&1 || true
          docker run --rm -v "$PWD/crates/graph-core/src:/src:ro" -v mg-smoke:/data memory-graph:smoke \
            index --org smoke --repo graph-core /src --json | tee index.json
          python3 -c 'import json; s=json.load(open("index.json")); assert s["files"] > 0 and s["tokens"] > 0 and s["failed"] == 0, s'
          docker run --rm -v mg-smoke:/data memory-graph:smoke search Node --language rust --json | tee search.json
          python3 -c 'import json; r=json.load(open("search.json")); assert r["results"], r'
          docker run --rm -v mg-smoke:/data memory-graph:smoke describe --json | tee describe.json
          python3 -c 'import json; d=json.load(open("describe.json")); assert [r for r in d["repos"] if r["repo"] == "graph-core"], d'
          # The image runs as a numeric non-root user with nothing else in it.
          docker run --rm -v mg-smoke:/data memory-graph:smoke describe --json >/dev/null
          docker inspect memory-graph:smoke --format '{{.Config.User}} {{.Config.WorkingDir}} {{.Config.Entrypoint}}' | grep -q '^65532:65532 /data \[/memory-graph\]$'
          docker volume rm -f mg-smoke >/dev/null

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build linux/amd64 + linux/arm64 and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
