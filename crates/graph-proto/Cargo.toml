[package]
name = "graph-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "memory-graph wire contract (ADR 0004 D1): the memory_graph.v1 protobuf messages and gRPC services, with conversions to and from graph-core / graph-store types."

[dependencies]
graph-core = { path = "../graph-core" }
graph-store = { path = "../graph-store" }
prost.workspace = true
prost-types.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
# W3C trace context in gRPC metadata (ADR 0009 D5, `trace_context`): the
# current `tracing` span's OpenTelemetry context, injected and extracted
# with the SDK's TraceContextPropagator. No exporter here.
tracing.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
tracing-opentelemetry.workspace = true

[dev-dependencies]
proptest.workspace = true
redb.workspace = true
serde.workspace = true
serde_json.workspace = true
