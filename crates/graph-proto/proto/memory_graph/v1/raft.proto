// Node-to-node Raft transport (ADR 0004 D5) and the replicated log entry.
//
// Stage B: the RPCs carry openraft's request/response types as small typed
// fields; log entries travel in the log store's own binary framing
// (`encode_entry` in graph-server's `raft/log_store.rs`: `kind:u8 | term:u64
// | node_id:u64 | index:u64 | payload`, little endian), never as JSON, so an
// `IndexChunk` of 8 MiB of source bytes costs 8 MiB plus 25 bytes on the
// wire. Served on the same port as the client services.
syntax = "proto3";

package memory_graph.v1;

import "memory_graph/v1/common.proto";

service Raft {
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc Vote(VoteRequest) returns (VoteResponse);
  // Snapshot transfer: an `InstallSnapshotHeader` then the snapshot file in
  // chunks (1 MiB each), in order. The receiver checks the size and the
  // SHA-256 against the header and refuses another store format or
  // extractor version set hash with FAILED_PRECONDITION.
  rpc InstallSnapshot(stream InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

// `openraft::Vote<u64>`: the leader id (term, node) and whether it is
// committed (granted by a quorum).
message RaftVote {
  uint64 term = 1;
  uint64 node_id = 2;
  bool committed = 3;
}

// `openraft::LogId<u64>`: the leader id that proposed the entry and its
// index.
message RaftLogId {
  uint64 term = 1;
  uint64 node_id = 2;
  uint64 index = 3;
}

message AppendEntriesRequest {
  RaftVote vote = 1;
  // Absent: the entries start at the beginning of the log.
  optional RaftLogId prev_log_id = 2;
  optional RaftLogId leader_commit = 3;
  // Each entry in the log store's binary framing (see the file comment).
  repeated bytes entries = 4;
}
message AppendEntriesResponse {
  // `PartialSuccess` with no matching log id.
  message Partial {
    optional RaftLogId matching = 1;
  }
  oneof result {
    // All entries were appended.
    RaftEmpty success = 1;
    // Only a prefix up to `matching` was appended.
    Partial partial_success = 2;
    // `prev_log_id` does not match on the receiver.
    RaftEmpty conflict = 3;
    // The receiver has seen a higher vote.
    RaftVote higher_vote = 4;
  }
}
message RaftEmpty {}

message VoteRequest {
  RaftVote vote = 1;
  optional RaftLogId last_log_id = 2;
}
message VoteResponse {
  RaftVote vote = 1;
  bool vote_granted = 2;
  optional RaftLogId last_log_id = 3;
}

message InstallSnapshotHeader {
  // The sending leader's vote.
  RaftVote vote = 1;
  // `SnapshotMeta.last_log_id`.
  optional RaftLogId last_log_id = 2;
  // `SnapshotMeta.last_membership`: serde_json `openraft::StoredMembership`
  // (a few hundred bytes).
  bytes membership_json = 3;
  // `SnapshotMeta.snapshot_id`.
  string snapshot_id = 4;
  // The store format version of the snapshot file (`graph_store::SCHEMA_VERSION`).
  uint64 store_format_version = 5;
  // The extractor version set hash the snapshot was built with (D5).
  string extractors_hash = 6;
  // Byte length and lowercase hex SHA-256 of the file that follows.
  uint64 size = 7;
  string sha256 = 8;
}

message InstallSnapshotRequest {
  oneof msg {
    InstallSnapshotHeader header = 1;
    // A chunk of the exported store file, in order.
    bytes chunk = 2;
  }
}
message InstallSnapshotResponse {
  // The receiver's vote after the install.
  RaftVote vote = 1;
}

// One replicated log entry (ADR 0004 D5): what the state machine applies in
// one marked transaction (`V2Store::index_prepared_marked` and friends).
message LogCommand {
  // Raw bytes of some files of one repo, cut by the leader at
  // `RAFT_ENTRY_MAX_BYTES` (8 MiB; a single larger file is an entry alone).
  message IndexChunk {
    string org = 1;
    string repo = 2;
    // `IndexOptions::reindex`.
    bool reindex = 3;
    repeated FileBytes files = 4;
  }
  // A caller-supplied extraction (the one command that ships one).
  message IngestExtraction {
    string org = 1;
    string repo = 2;
    string path = 3;
    string language = 4;
    Extraction extraction = 5;
    optional string origin = 6;
  }
  // `Store::prune_files` (never a dry run; those are node-local).
  message Prune {
    string org = 1;
    string repo = 2;
    repeated string keep = 3;
  }
  message Vacuum {}
  // Blank/membership entries: nothing to apply, only the marker moves.
  message Noop {}

  oneof cmd {
    IndexChunk index_chunk = 1;
    IngestExtraction ingest_extraction = 2;
    Prune prune = 3;
    Vacuum vacuum = 4;
    Noop noop = 5;
  }
}
