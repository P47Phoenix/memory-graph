// Operator surface of a memory-graph server (ADR 0004 D1/D9/D10). Stage A
// implements `Status`, `SysInfo`, `Compact` and `Shutdown`; stage B adds
// `Members`, `Leader`, `TriggerSnapshot`, `AddLearner` and `Promote`;
// stage C adds the guards, `Remove`, `TransferLeader`, `Join`,
// `TriggerElect` and `ReadIndex`. Membership changes (`AddLearner`,
// `Promote`, `Remove`, `TransferLeader`, `Join`) may be sent to any node:
// a follower forwards them to the leader.
syntax = "proto3";

package memory_graph.v1;

import "memory_graph/v1/common.proto";

service Admin {
  rpc Status(StatusRequest) returns (StatusResponse);
  // The server's `sysinfo` report (memory, disk, cgroup) as the CLI's JSON.
  rpc SysInfo(SysInfoRequest) returns (SysInfoResponse);
  // Rebuild the store file in place (`V2Store::compact`): node-local, never
  // replicated; pauses apply for its duration.
  rpc Compact(CompactRequest) returns (CompactResponse);
  // Graceful shutdown: stop accepting, finish in-flight, close the store.
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);

  // Cluster operations (stage B/C).
  rpc Members(MembersRequest) returns (MembersResponse);
  rpc Leader(LeaderRequest) returns (LeaderResponse);
  rpc AddLearner(AddLearnerRequest) returns (AddLearnerResponse);
  rpc Promote(PromoteRequest) returns (PromoteResponse);
  rpc Remove(RemoveRequest) returns (RemoveResponse);
  rpc TransferLeader(TransferLeaderRequest) returns (TransferLeaderResponse);
  // `serve --join`: a new (or restarted, still learner) node asks to be
  // added as a learner; the leader validates it and answers the cluster id.
  rpc Join(JoinRequest) returns (JoinResponse);
  // Campaign now (`Raft::trigger().elect()` on this node): the second half
  // of `TransferLeader`, sent by the leader to the target.
  rpc TriggerElect(TriggerElectRequest) returns (TriggerElectResponse);
  // The leader's read barrier for a follower's `LINEARIZABLE` read: the
  // leader confirms its leadership with a quorum and answers the log index
  // the follower must have applied before it serves the read.
  rpc ReadIndex(ReadIndexRequest) returns (ReadIndexResponse);
  // Build a snapshot now; with `download`, stream the snapshot file back
  // (a `SnapshotInfo` first, then the file in 1 MiB chunks) so a remote
  // client can keep a backup (`cluster snapshot --out`).
  rpc TriggerSnapshot(TriggerSnapshotRequest) returns (stream TriggerSnapshotResponse);
  // Prometheus text exposition of the server's metrics.
  rpc Metrics(MetricsRequest) returns (MetricsResponse);
  // `serve --update-advertise` (stage F): member `node_id` now listens at
  // `addr`. The leader asks the server at `addr` who it is (it must be that
  // node, of this cluster, with this cluster's extractors) and replaces the
  // node's address in the membership (one membership log entry; voters and
  // learners unchanged). Idempotent: the address already in effect changes
  // nothing. May be sent to any member: a follower forwards it.
  rpc UpdateAdvertise(UpdateAdvertiseRequest) returns (UpdateAdvertiseResponse);
}

message StatusRequest {}
message StatusResponse {
  uint64 node_id = 1;
  string cluster_id = 2;
  optional uint64 leader_id = 3;
  optional string leader_addr = 4;
  // Raft role as openraft names it (`Leader`, `Follower`, `Learner`, ...).
  string state = 5;
  uint64 current_term = 6;
  // Last log index/term applied to the store (`RAFT_SM.last_applied`).
  uint64 applied_index = 7;
  uint64 applied_term = 8;
  // Last log index known to be committed.
  uint64 committed_index = 9;
  uint64 last_log_index = 10;
  string server_version = 11;
  uint32 protocol_version = 12;
  uint64 store_format_version = 13;
  string extractors_hash = 14;
  string db_path = 15;
  string listen_addr = 16;
  uint64 uptime_secs = 17;
  SnapshotStats snapshots = 18;
  // Open snapshot handles held for clients (`Store.OpenSnapshot`).
  uint64 snapshot_handles = 19;
  // Raft role, lower case: `leader`, `follower`, `candidate`, `learner`,
  // `shutdown`.
  string role = 20;
  // Log index of the current snapshot (0: none) and of the last purged
  // entry (0: none purged).
  uint64 snapshot_index = 21;
  uint64 purged_index = 22;
  // Every member with its role and address.
  repeated Member members = 23;
  // The leader only: how far each peer's matched log index is behind this
  // node's last log index.
  repeated PeerLag replication = 24;
  // Bytes of the Raft log file and of the store file on disk.
  uint64 log_bytes = 25;
  uint64 store_bytes = 26;
  // The data directory (`serve --data-dir`); empty in `--db` mode.
  string data_dir = 27;
  // This node's advertised address (`--advertise`).
  string advertise = 28;
  // Writes (and membership changes) this node forwarded to the leader
  // since it started (ADR 0004 D8; stage E exports it as a metric).
  uint64 writes_forwarded_total = 29;
  // gRPC calls this node served since it started, every method and outcome
  // (the sum of `mg_rpc_total`).
  uint64 rpcs_total = 30;
  // Log entries this node applied since it started (the count of
  // `mg_apply_duration_seconds`).
  uint64 entries_applied_total = 31;
  // Where this node's MCP endpoint listens (`serve --mcp-listen`, ADR 0005
  // D5), as bound: `host:port`, the endpoint being `http://<it>/mcp`.
  // Empty: MCP is off (or the server predates the field).
  string mcp_addr = 33;
  // Snapshot backups (ADR 0006, `serve --backup-url`); absent when this
  // node has no backup location.
  optional BackupStatus backup = 32;
}

// This node's snapshot backups since it started.
message BackupStatus {
  // The location, e.g. `file:///srv/backups` (never a secret).
  string url = 1;
  // `--backup-on`: `leader`, `all` or `none`.
  string on = 2;
  // Log index of the last snapshot committed to the location (0: none).
  uint64 last_index = 3;
  // Unix seconds of that commit (0: none).
  uint64 last_success_unix = 4;
  // Uploads that failed after every retry.
  uint64 failures_total = 5;
  // Bytes written by successful uploads.
  uint64 bytes_total = 6;
  // The last failure; empty once an upload succeeds again.
  string last_backup_error = 7;
}

// Replication progress of one peer, as the leader sees it.
message PeerLag {
  uint64 node_id = 1;
  // The highest log index known to match on the peer (absent: none yet).
  optional uint64 matched_index = 2;
  // `last_log_index - matched_index` on the leader.
  uint64 lag = 3;
  // The last error replicating to this peer (its gRPC code and message):
  // set while RPCs to it keep failing, or while it lags and no entries or
  // snapshot reached it since the error; empty otherwise.
  string last_error = 4;
}

message SysInfoRequest {}
message SysInfoResponse {
  // The `memory-graph sysinfo --json` document of the server's machine.
  string json = 1;
}

message CompactRequest {}
message CompactResponse { CompactStats stats = 1; }

message ShutdownRequest {
  // How long to wait for in-flight work; 0 means the server's default.
  uint64 grace_ms = 1;
}
message ShutdownResponse {}

// One cluster member as openraft knows it.
message Member {
  uint64 node_id = 1;
  string addr = 2;
  // `voter` or `learner`.
  string role = 3;
  // The member's extractor version set hash (ADR 0004 D5).
  string extractors_hash = 4;
}

message MembersRequest {}
message MembersResponse {
  repeated Member members = 1;
  optional uint64 leader_id = 2;
}

message LeaderRequest {}
message LeaderResponse {
  optional uint64 leader_id = 1;
  optional string leader_addr = 2;
}

message AddLearnerRequest {
  uint64 node_id = 1;
  string addr = 2;
  // Wait until the learner has caught up with the leader's log before
  // answering.
  bool blocking = 3;
}
message AddLearnerResponse {
  // Log index of the membership change.
  uint64 log_index = 1;
}

message PromoteRequest { uint64 node_id = 1; }
message PromoteResponse { uint64 log_index = 1; }

message RemoveRequest {
  uint64 node_id = 1;
  // Allow taking 3 voters down to 2 (a cluster that then tolerates no
  // failure). Never allows removing the leader or dropping below quorum.
  bool force = 2;
}
message RemoveResponse {
  uint64 log_index = 1;
  // The node was not a member, so nothing changed (Remove stays idempotent;
  // log_index is then the current membership's). Additive (ADR 0004 D1, no
  // PROTOCOL_VERSION bump): an older server never sets it, and false keeps
  // the old meaning.
  bool not_a_member = 2;
}

message TransferLeaderRequest { uint64 to_node_id = 1; }
message TransferLeaderResponse {
  // The leader once the transfer finished (the target).
  uint64 leader_id = 1;
}

message JoinRequest {
  uint64 node_id = 1;
  // `host:port` the leader and the other members reach the joiner at.
  string advertise = 2;
  // Must equal the cluster's (ADR 0004 D5).
  string extractors_hash = 3;
  uint64 store_format_version = 4;
  uint32 protocol_version = 5;
  // Promote to voter once the joiner's replication lag is zero
  // (`--auto-promote`); otherwise it stays a learner.
  bool auto_promote = 6;
  // Set on the joiner's periodic re-send while it believes it is a
  // learner (`--auto-promote`, and every restart of a joined node). The
  // leader never adds a node back on such a request: a node that is no
  // longer a member was removed, and only `cluster add-learner` (or a
  // fresh `--join` from an empty directory) adds it again.
  bool rejoin = 7;
}
message JoinResponse {
  string cluster_id = 1;
  repeated Member members = 2;
  optional uint64 leader_id = 3;
  // Log index of the membership change (0: already a learner).
  uint64 log_index = 4;
}

message TriggerElectRequest {}
message TriggerElectResponse {}

message ReadIndexRequest {}
message ReadIndexResponse {
  // The follower serves the read once it has applied this index.
  uint64 read_index = 1;
}

message TriggerSnapshotRequest {
  // Stream the snapshot file back after the `SnapshotInfo`.
  bool download = 1;
}
// What the snapshot is: always the first message of the stream.
message SnapshotInfo {
  // Index/term of the last entry the snapshot contains.
  uint64 last_applied_index = 1;
  uint64 last_applied_term = 2;
  uint64 size = 3;
  // Lowercase hex SHA-256 of the file.
  string sha256 = 4;
  string extractors_hash = 5;
  uint64 store_format_version = 6;
}
message TriggerSnapshotResponse {
  oneof msg {
    SnapshotInfo info = 1;
    // A chunk of the snapshot file, in order (only with `download`).
    bytes chunk = 2;
  }
}

message MetricsRequest {}
message MetricsResponse {
  // Prometheus text exposition format.
  string text = 1;
}

message UpdateAdvertiseRequest {
  uint64 node_id = 1;
  // The new `host:port` the leader and the other members reach it at.
  string addr = 2;
}
message UpdateAdvertiseResponse {
  // Log index of the membership change (the membership in effect when the
  // address was already this one).
  uint64 log_index = 1;
}
