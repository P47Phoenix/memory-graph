[package]
name = "graph-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "memory-graph server (ADR 0004): the tonic services over a store replicated by an openraft node."

[dependencies]
graph-core = { path = "../graph-core" }
graph-store = { path = "../graph-store" }
graph-proto = { path = "../graph-proto" }
# `testing::ClusterTestbed::client` hands tests a RemoteStore.
graph-client = { path = "../graph-client" }
# The MCP tool core behind `--mcp-listen` (ADR 0005 D1/D3).
graph-mcp = { path = "../graph-mcp" }
axum.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
openraft.workspace = true
tonic.workspace = true
tonic-health.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tower-layer.workspace = true
tower-service.workspace = true
redb.workspace = true
sha2.workspace = true
rand.workspace = true
# `testing::ClusterTestbed` keeps its nodes in a temp dir.
tempfile.workspace = true
# The S3 backup sink (ADR 0006 E4): a hand-written client over the hyper
# and http already in the tree (via tonic/axum), SigV4 with hmac + sha2.
# New crates: hmac, quick-xml (MIT/Apache) and, through hmac, `subtle`
# (BSD-3-Clause, accepted by the owner 2026-09-29). All pure Rust.
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
percent-encoding = "2"
quick-xml = "0.37"
hmac = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
# `kill(pid, 0)` for the stale-LOCK check: pure Rust bindings, gate-clean.
libc = "0.2"
# `statvfs` for the disk guard (pure Rust, as in graph-cli).
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
proptest.workspace = true
graph-lang-rust = { path = "../graph-lang-rust" }
graph-lang-csharp = { path = "../graph-lang-csharp" }
graph-lang-javascript = { path = "../graph-lang-javascript" }
