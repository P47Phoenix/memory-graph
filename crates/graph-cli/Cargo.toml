[package]
name = "graph-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "graph_cli"
path = "src/lib.rs"

[[bin]]
name = "memory-graph"
path = "src/main.rs"

[features]
default = ["lang-rust", "lang-csharp", "lang-javascript", "lang-aspx", "lang-html", "lang-sql", "lang-shell", "lang-r", "lang-fsharp", "lang-haskell", "lang-elixir", "lang-gdscript", "lang-c", "lang-go", "lang-scala", "lang-cobol", "lang-rpg", "lang-asm", "lang-typescript", "lang-python", "lang-java"]
lang-rust = ["dep:graph-lang-rust"]
lang-csharp = ["dep:graph-lang-csharp"]
lang-javascript = ["dep:graph-lang-javascript"]
lang-aspx = ["dep:graph-lang-aspx"]
lang-html = ["dep:graph-lang-html"]
lang-typescript = ["dep:graph-lang-typescript"]
lang-python = ["dep:graph-lang-python"]
lang-java = ["dep:graph-lang-java"]
lang-sql = ["dep:graph-lang-sql"]
lang-shell = ["dep:graph-lang-shell"]
lang-r = ["dep:graph-lang-r"]
lang-fsharp = ["dep:graph-lang-fsharp"]
lang-haskell = ["dep:graph-lang-haskell"]
lang-elixir = ["dep:graph-lang-elixir"]
lang-gdscript = ["dep:graph-lang-gdscript"]
# One feature for both the C and the C++ extractor (one crate, one scanner).
lang-c = ["dep:graph-lang-c"]
lang-go = ["dep:graph-lang-go"]
lang-scala = ["dep:graph-lang-scala"]
lang-cobol = ["dep:graph-lang-cobol"]
lang-rpg = ["dep:graph-lang-rpg"]
lang-asm = ["dep:graph-lang-asm"]

[dependencies]
graph-core = { path = "../graph-core" }
graph-store = { path = "../graph-store" }
graph-server = { path = "../graph-server" }
graph-client = { path = "../graph-client" }
graph-proto = { path = "../graph-proto" }
graph-mcp = { path = "../graph-mcp" }
graph-lang-rust = { path = "../graph-lang-rust", optional = true }
graph-lang-csharp = { path = "../graph-lang-csharp", optional = true }
graph-lang-javascript = { path = "../graph-lang-javascript", optional = true }
graph-lang-aspx = { path = "../graph-lang-aspx", optional = true }
graph-lang-html = { path = "../graph-lang-html", optional = true }
graph-lang-typescript = { path = "../graph-lang-typescript", optional = true }
graph-lang-python = { path = "../graph-lang-python", optional = true }
graph-lang-java = { path = "../graph-lang-java", optional = true }
graph-lang-sql = { path = "../graph-lang-sql", optional = true }
graph-lang-shell = { path = "../graph-lang-shell", optional = true }
graph-lang-r = { path = "../graph-lang-r", optional = true }
graph-lang-fsharp = { path = "../graph-lang-fsharp", optional = true }
graph-lang-haskell = { path = "../graph-lang-haskell", optional = true }
graph-lang-elixir = { path = "../graph-lang-elixir", optional = true }
graph-lang-gdscript = { path = "../graph-lang-gdscript", optional = true }
graph-lang-c = { path = "../graph-lang-c", optional = true }
graph-lang-go = { path = "../graph-lang-go", optional = true }
graph-lang-scala = { path = "../graph-lang-scala", optional = true }
graph-lang-cobol = { path = "../graph-lang-cobol", optional = true }
graph-lang-rpg = { path = "../graph-lang-rpg", optional = true }
graph-lang-asm = { path = "../graph-lang-asm", optional = true }
clap.workspace = true
ignore.workspace = true
anyhow.workspace = true
serde_json.workspace = true
indicatif.workspace = true
console.workspace = true
crossbeam-channel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# serve --config <file.toml> (pure Rust).
toml = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

# Memory probes: sysinfo(2) and sysconf on Linux (when /proc is not there),
# sysctl / host_statistics64 / proc_pidinfo on macOS. Pure Rust bindings
# (no `links`, no C build script), so the no-C-deps gate accepts it.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
anyhow.workspace = true
graph-store = { path = "../graph-store" }
redb.workspace = true
# deploy_manifests: parse the Kubernetes and Compose YAML (pure Rust).
yaml-rust2 = "0.10"
