[workspace]
resolver = "2"
members = ["crates/graph-lang-rust", "crates/graph-core", "crates/graph-store", "crates/graph-cli", "examples/toy-extractor", "crates/graph-lang-csharp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
redb = "2"
clap = { version = "4", features = ["derive"] }
thiserror = "1"
anyhow = "1"
proptest = "1"
tempfile = "3"
ignore = "0.4"

# Optimise dependencies (redb, serde_json, ...) in dev/test builds so the
# corpus test does not spend ~20s in unoptimised storage code.
[profile.dev.package."*"]
opt-level = 3
