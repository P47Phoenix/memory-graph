[workspace]
resolver = "2"
members = ["crates/graph-lang-rust", "crates/graph-core", "crates/graph-store", "crates/graph-cli", "examples/toy-extractor", "crates/graph-lang-csharp", "crates/graph-lang-javascript", "crates/graph-lang-html", "crates/graph-lang-aspx", "crates/graph-proto", "crates/graph-server", "crates/graph-client"]
# Dev tooling with its own workspace and lockfile (proto codegen: prost-build,
# tonic-prost-build, protox); never shipped, never seen by the pure-Rust gate.
exclude = ["xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
redb = "2"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "1"
anyhow = "1"
proptest = "1"
tempfile = "3"
ignore = "0.4"
indicatif = "=0.17.7"
console = "0.15"
crossbeam-channel = "0.5"
# Wire protocol (ADR 0004 D1), pinned exactly: the generated code under
# crates/graph-proto/src/gen is checked in and must match these versions.
# tonic without any `tls*` feature (the pure-Rust gate would refuse ring /
# aws-lc); there is no `prost` feature in tonic 0.14, the codec is tonic-prost.
prost = "=0.14.4"
prost-types = "=0.14.4"
tonic = { version = "=0.14.6", default-features = false, features = ["transport", "codegen", "router", "server", "channel"] }
tonic-prost = "=0.14.6"
# Server and client runtime (ADR 0004 D2/D5), pinned exactly. openraft 0.9
# with storage-v2 (RaftLogStorage/RaftStateMachine), serde (its metadata
# types on disk) and generic-snapshot-data (a snapshot is a store file, not
# an AsyncRead). rand 0.8 is the line openraft already pulls.
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "signal", "io-util"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
futures-util = "=0.3.34"
bytes = "=1.12.1"
async-trait = "=0.1.92"
openraft = { version = "=0.9.25", features = ["serde", "storage-v2", "generic-snapshot-data"] }
tonic-health = "=0.14.6"
rand = "=0.8.8"
tracing = "=0.1.44"

# Optimise dependencies (redb, serde_json, ...) in dev/test builds so the
# corpus test does not spend ~20s in unoptimised storage code.
[profile.dev.package."*"]
opt-level = 3
