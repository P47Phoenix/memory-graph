[workspace]
resolver = "2"
members = ["crates/graph-lang-rust", "crates/graph-core", "crates/graph-store", "crates/graph-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redb = "2"
clap = { version = "4", features = ["derive"] }
thiserror = "1"
anyhow = "1"
proptest = "1"
tempfile = "3"
ignore = "0.4"
